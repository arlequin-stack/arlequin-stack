    <rect x="62" y="158" width="237.03" height="4" rx="2" fill="#38BDF8"/>
  <circle cx="49" cy="188" r="4" fill="#60A5FA"/>
    <text x="62" y="193" fill="#E2E8F0" font-size="13" font-weight="700">TypeScript</text>
    <text x="556" y="193" fill="#F8FAFC" text-anchor="end" font-size="16" font-weight="750">32.4%</text>
    <rect x="62" y="204" width="494" height="4" rx="2" fill="#1E293B"/>
    <rect x="62" y="204" width="159.94" height="4" rx="2" fill="#60A5FA"/>
  <circle cx="49" cy="234" r="4" fill="#A5F3FC"/>
    <text x="62" y="239" fill="#E2E8F0" font-size="13" font-weight="700">CSS</text>
    <text x="556" y="239" fill="#F8FAFC" text-anchor="end" font-size="16" font-weight="750">9.0%</text>
